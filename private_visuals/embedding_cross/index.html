<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cruce noticias · expedientes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-news" viewBox="0 0 24 24"><path d="M4 5h13v14H6a2 2 0 0 1-2-2z"/><path d="M17 9h3v8a2 2 0 0 1-2 2"/><path d="M8 9h5M8 13h5"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
    <symbol id="i-flask" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6L5 18a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3"/><path d="M7.5 15h9"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></symbol>
    <symbol id="i-empty" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M8.5 11h5"/></symbol>
  </svg>

  <header class="top">
    <div class="wrap">
      <div class="brand">
        <span class="brand-mark"><svg><use href="#i-link"/></svg></span>
        <div>
          <h1>Cruce noticias · expedientes</h1>
          <p class="sub" id="subtitle">Similitud por embeddings, de mayor a menor</p>
        </div>
        <span class="badge-test" id="test-badge" hidden><svg><use href="#i-flask"/></svg>Datos de prueba</span>
      </div>
      <dl class="stats" id="stats"></dl>
    </div>
  </header>

  <div class="toolbar">
    <div class="wrap toolbar-inner">
      <label class="search">
        <svg><use href="#i-search"/></svg>
        <input id="q" type="search" placeholder="Buscar en títulos, expedientes o número…" autocomplete="off">
      </label>
      <div class="chips" id="outlets" role="group" aria-label="Medios"></div>
      <div class="controls">
        <label class="range">
          <span>Score mín. <b id="min-val">0.00</b></span>
          <input id="min" type="range" min="0" max="0.95" step="0.01" value="0">
        </label>
        <label class="select">
          <span class="sr">Orden</span>
          <select id="sort">
            <option value="score">Mejor score</option>
            <option value="mean">Promedio top 5</option>
            <option value="date">Más recientes</option>
          </select>
          <svg><use href="#i-chevron"/></svg>
        </label>
      </div>
    </div>
  </div>

  <main class="wrap">
    <p class="result-line" id="result-line"></p>
    <div id="list" class="list"></div>
    <div id="sentinel" class="sentinel"></div>
    <div id="empty" class="empty" hidden>
      <svg><use href="#i-empty"/></svg>
      <p>Ninguna noticia coincide con los filtros.</p>
    </div>
    <div id="nodata" class="empty" hidden>
      <svg><use href="#i-doc"/></svg>
      <p>No se encontró <code>private_visuals/output/embedding_cross/data.js</code>.</p>
      <p class="hint">Generalo con <code>python private_visuals/embedding_cross/make_test_data.py</code></p>
    </div>
  </main>

  <button class="to-top" id="to-top" aria-label="Volver arriba" hidden><svg><use href="#i-up"/></svg></button>

  <script src="../output/embedding_cross/data.js"></script>
  <script src="app.js"></script>
</body>
</html>
