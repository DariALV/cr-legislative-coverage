<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Respuestas de Jev</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="analysis.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-news" viewBox="0 0 24 24"><path d="M4 5h13v14H6a2 2 0 0 1-2-2z"/><path d="M17 9h3v8a2 2 0 0 1-2 2"/><path d="M8 9h5M8 13h5"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 5h16l-6 8v5l-4 2v-7z"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></symbol>
    <symbol id="i-empty" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M8.5 11h5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
    <symbol id="i-timeline" viewBox="0 0 24 24"><path d="M3 12h18"/><circle cx="7" cy="12" r="2"/><circle cx="14" cy="12" r="2"/><path d="M7 5v3M14 16v3M19 5v3"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 4 2.4 5 5.6.6-4.2 3.8 1.2 5.6L12 16.2 7 19l1.2-5.6L4 9.6 9.6 9z"/></symbol>
  </svg>

  <header class="top">
    <div class="wrap">
      <div class="brand">
        <span class="brand-mark"><svg><use href="#i-spark"/></svg></span>
        <div>
          <h1>Respuestas de Jev</h1>
          <p class="sub" id="subtitle">Pares noticia · expediente del corpus</p>
        </div>
      </div>
      <dl class="stats" id="stats"></dl>
    </div>
  </header>

  <div class="toolbar">
    <div class="wrap toolbar-inner">
      <div class="tabs" role="tablist" aria-label="Vista">
        <button role="tab" class="tab" data-view="news" aria-selected="true"><svg><use href="#i-news"/></svg>Por noticia</button>
        <button role="tab" class="tab" data-view="bill" aria-selected="false"><svg><use href="#i-doc"/></svg>Por expediente</button>
        <button role="tab" class="tab" data-view="analysis" aria-selected="false"><svg><use href="#i-chart"/></svg>Análisis</button>
      </div>
      <label class="search">
        <svg><use href="#i-search"/></svg>
        <input id="q" type="search" placeholder="Buscar título, expediente o número…" autocomplete="off">
      </label>
      <div class="controls">
        <div class="thr">
          <label class="range" for="thr">
            <span>Umbral <b id="thr-val">0,50</b></span>
            <input id="thr" type="range" min="0.1" max="1" step="0.01" value="0.5">
          </label>
          <div class="seg" id="mode" role="group" aria-label="Probabilidad usada por el umbral">
            <button data-mode="max" aria-pressed="true" title="Máximo entre explícito e implícito">Máx</button>
            <button data-mode="ex" aria-pressed="false" title="Solo la pregunta explícita">Expl.</button>
            <button data-mode="im" aria-pressed="false" title="Solo la pregunta implícita">Impl.</button>
          </div>
        </div>
        <label class="select">
          <span class="sr">Orden</span>
          <select id="sort"></select>
          <svg><use href="#i-chevron"/></svg>
        </label>
        <button class="btn" id="toggle-filters" aria-expanded="false"><svg><use href="#i-filter"/></svg>Filtros<span class="count" id="filter-count" hidden></span></button>
      </div>
      <div class="chips" id="outlets" role="group" aria-label="Medios"></div>
    </div>
    <div class="filters" id="filters" hidden>
      <div class="wrap filters-grid" id="filters-grid"></div>
    </div>
  </div>

  <main class="wrap">
    <section class="summary" id="summary-box">
      <button class="summary-head" id="toggle-summary" aria-expanded="true">
        <svg><use href="#i-chart"/></svg><span>Resumen de lo filtrado</span><svg class="chev"><use href="#i-chevron"/></svg>
      </button>
      <div class="charts" id="charts"></div>
    </section>

    <div class="active" id="active"></div>
    <section class="analysis" id="analysis" hidden></section>
    <p class="result-line" id="result-line"></p>
    <div id="list" class="list"></div>
    <div id="sentinel" class="sentinel"></div>
    <div id="empty" class="empty" hidden>
      <svg><use href="#i-empty"/></svg>
      <p>Ningún par coincide con los filtros.</p>
    </div>
    <div id="nodata" class="empty" hidden>
      <svg><use href="#i-doc"/></svg>
      <p>No se encontró <code>private_visuals/output/jev_answers/data.js</code>.</p>
      <p class="hint">Generalo con <code>python private_visuals/jev_answers/build_data.py</code></p>
    </div>
  </main>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="panel" id="panel" aria-hidden="true" aria-label="Respuestas del par">
    <button class="panel-close" id="panel-close" aria-label="Cerrar"><svg><use href="#i-x"/></svg></button>
    <div class="panel-body" id="panel-body"></div>
  </aside>

  <div class="tip" id="tip" hidden></div>
  <button class="to-top" id="to-top" aria-label="Volver arriba" hidden><svg><use href="#i-up"/></svg></button>

  <script src="../output/jev_answers/data.js"></script>
  <script src="labels.js"></script>
  <script src="analysis.js"></script>
  <script src="app.js"></script>
</body>
</html>
