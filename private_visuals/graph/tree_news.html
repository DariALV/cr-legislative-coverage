<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Árbol de noticias</title>
  <link rel="stylesheet" href="../theme/theme.css">
  <link rel="stylesheet" href="styles.css">
  <script src="../theme/theme.js"></script>
</head>
<!-- The similarity tree of the site's pages (#71), from any root and with every parameter at hand. The panel is
     built by tree.js; the trees come from the local server (graph/tree_api.py), so this page needs server.py. -->
<body data-kind="news">
  <div class="app">
    <aside class="side" data-page="graph" data-subnav="views"></aside>
    <script src="../theme/nav.js"></script>

    <div class="main">
      <canvas id="graph" aria-label="Árbol de noticias"></canvas>

      <header class="title">
        <h1 id="heading">Árbol de noticias</h1>
        <p id="subtitle"></p>
      </header>

      <p id="missing" class="missing" hidden></p>

      <aside id="panel" class="panel">
        <button id="panel-toggle" class="panel-toggle" aria-expanded="true" aria-controls="panel-body">
          <span>Controles</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div id="panel-body" class="panel-body"></div>
      </aside>

      <section id="card" class="detail" hidden aria-live="polite"></section>
    </div>
  </div>

  <div id="tip" class="tip" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script src="controls.js"></script>
  <script src="tree.js"></script>
</body>
</html>
