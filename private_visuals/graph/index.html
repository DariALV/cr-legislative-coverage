<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grafo de expedientes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="graph" aria-label="Grafo de expedientes legislativos"></canvas>

  <header class="title">
    <h1>Expedientes por parecido</h1>
    <p id="subtitle"></p>
  </header>

  <p id="missing" class="missing" hidden>
    Faltan los datos. Generalos con <code>python private_visuals/graph/build_graph.py</code> y recargá la página.
  </p>

  <aside id="panel" class="panel">
    <button id="panel-toggle" class="panel-toggle" aria-expanded="true" aria-controls="panel-body">
      <span>Controles</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div id="panel-body" class="panel-body">
      <details open>
        <summary>Filtros</summary>
        <input id="q" type="search" placeholder="Buscar número o nombre…" autocomplete="off" aria-label="Buscar expediente">
        <p id="search-count" class="hint"></p>
        <label class="switch"><span>Sin cobertura</span><input id="show-uncovered" type="checkbox"><i></i></label>
        <label class="switch"><span>Más de 4 años</span><input id="show-old" type="checkbox"><i></i></label>
      </details>

      <details open>
        <summary>Grupos</summary>
        <div id="modes" class="modes" role="group" aria-label="Color de los nodos"></div>
        <div id="scale" class="scale" hidden>
          <div id="scale-bar" class="scale-bar"></div>
          <div class="scale-ends"><span>en contra</span><span>neutral</span><span>a favor</span></div>
        </div>
        <div id="legend" class="legend"></div>
        <button id="legend-clear" class="link-button" hidden>Quitar selección</button>
        <p id="legend-note" class="hint"></p>
      </details>

      <details>
        <summary>Apariencia</summary>
        <div id="appearance"></div>
        <label class="switch"><span>Nombres de los temas</span><input id="group-labels" type="checkbox"><i></i></label>
      </details>

      <details open>
        <summary>Fuerzas</summary>
        <label class="switch"><span>Física</span><input id="physics" type="checkbox"><i></i></label>
        <div id="forces"></div>
        <div class="buttons">
          <button id="reheat">Reanimar</button>
          <button id="fit">Encuadrar</button>
          <button id="reset">Restablecer</button>
        </div>
      </details>
    </div>
  </aside>

  <section id="card" class="card" hidden aria-live="polite"></section>
  <div id="tip" class="tip" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script src="../output/graph/bills.js" onerror="window.GRAPH_BILLS = null"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
