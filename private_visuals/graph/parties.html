<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grafo de partidos y temas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="graph" aria-label="Grafo de partidos y temas según la prensa"></canvas>

  <header class="title">
    <nav class="views" aria-label="Grafos">
      <a href="index.html">Expedientes</a>
      <a href="deputies.html">Diputados</a>
      <a href="parties.html" class="on" aria-current="page">Partidos y temas</a>
      <a href="news.html">Noticias</a>
      <a href="comentions.html">Co-mención</a>
      <a href="flow.html">Flujo</a>
      <a href="stream.html">En el tiempo</a>
    </nav>
    <h1>Qué apoya cada partido, según la prensa</h1>
    <p id="subtitle"></p>
  </header>

  <p id="missing" class="missing" hidden>
    Faltan los datos. Generalos con <code>python private_visuals/graph/build_graph.py</code> y recargá la página.
  </p>

  <aside id="panel" class="panel">
    <button id="panel-toggle" class="panel-toggle" aria-expanded="true" aria-controls="panel-body">
      <span>Controles</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div id="panel-body" class="panel-body">
      <details open>
        <summary>Filtros</summary>
        <label class="slider">
          <span>Mínimo de expedientes por enlace<output id="out-min-bills"></output></span>
          <input id="min-bills" type="range" min="1" max="15" step="1">
        </label>
        <label class="switch"><span>Enlaces a favor</span><input id="show-favor" type="checkbox"><i></i></label>
        <label class="switch"><span>Enlaces divididos</span><input id="show-neutral" type="checkbox"><i></i></label>
        <label class="switch"><span>Enlaces en contra</span><input id="show-against" type="checkbox"><i></i></label>
      </details>

      <details open>
        <summary>Grupos</summary>
        <div class="scale">
          <div id="scale-bar" class="scale-bar"></div>
          <div class="scale-ends"><span>en contra</span><span>dividido</span><span>a favor</span></div>
        </div>
        <div id="legend" class="legend"></div>
        <button id="legend-clear" class="link-button" hidden>Quitar selección</button>
        <p id="legend-note" class="hint"></p>
      </details>

      <details>
        <summary>Apariencia</summary>
        <div id="appearance"></div>
      </details>

      <details open>
        <summary>Fuerzas</summary>
        <label class="switch"><span>Física</span><input id="physics" type="checkbox"><i></i></label>
        <div id="forces"></div>
        <div class="buttons">
          <button id="reheat">Reanimar</button>
          <button id="fit">Encuadrar</button>
          <button id="reset">Restablecer</button>
        </div>
      </details>
    </div>
  </aside>

  <section id="card" class="card" hidden aria-live="polite"></section>
  <div id="tip" class="tip" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script src="../output/graph/bills.js" onerror="window.GRAPH_BILLS = null"></script>
  <script src="engine.js"></script>
  <script src="controls.js"></script>
  <script src="parties.js"></script>
</body>
</html>
