<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grafo de noticias</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="graph" aria-label="Grafo de noticias según su parecido"></canvas>

  <header class="title">
    <nav class="views" aria-label="Grafos">
      <a href="index.html">Expedientes</a>
      <a href="deputies.html">Diputados</a>
      <a href="parties.html">Partidos y temas</a>
      <a href="news.html" class="on" aria-current="page">Noticias</a>
      <a href="comentions.html">Co-mención</a>
      <a href="flow.html">Flujo</a>
      <a href="stream.html">En el tiempo</a>
    </nav>
    <h1 id="heading">Noticias por parecido</h1>
    <p id="subtitle"></p>
  </header>

  <p id="missing" class="missing" hidden>
    Faltan los datos. Generalos con <code>python private_visuals/graph/build_news.py</code> y recargá la página.
  </p>

  <aside id="panel" class="panel">
    <button id="panel-toggle" class="panel-toggle" aria-expanded="true" aria-controls="panel-body">
      <span>Controles</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div id="panel-body" class="panel-body">
      <details open>
        <summary>Filtros</summary>
        <div id="subsets" class="modes fit" role="group" aria-label="Qué noticias se ven"></div>
        <input id="q" type="search" placeholder="Buscar título, autor, medio o expediente…" autocomplete="off" aria-label="Buscar noticia">
        <p id="search-count" class="hint"></p>
      </details>

      <details open>
        <summary>Conexiones</summary>
        <div id="links" class="modes" role="group" aria-label="Qué une a dos noticias"></div>
        <p id="links-note" class="hint"></p>
      </details>

      <details open>
        <summary>Color</summary>
        <div id="modes" class="modes wrap" role="group" aria-label="Color de los nodos"></div>
        <div id="scale" class="scale" hidden>
          <div id="scale-bar" class="scale-bar"></div>
          <div class="scale-ends"><span>en contra</span><span>neutral</span><span>a favor</span></div>
        </div>
        <div id="legend" class="legend"></div>
        <button id="legend-clear" class="link-button" hidden>Quitar selección</button>
        <p id="legend-note" class="hint"></p>
      </details>

      <details open>
        <summary>Grupos</summary>
        <label class="field"><span>Agrupar por</span><select id="group-by" aria-label="Agrupar por"></select></label>
        <label class="switch"><span>Juntar los grupos</span><input id="gather" type="checkbox"><i></i></label>
        <label class="switch"><span>Figuras</span><input id="shapes" type="checkbox"><i></i></label>
        <label class="switch"><span>Ocultar la red</span><input id="hide-network" type="checkbox"><i></i></label>
        <p id="group-note" class="hint"></p>
      </details>

      <details>
        <summary>Apariencia</summary>
        <div id="appearance"></div>
      </details>

      <details>
        <summary>Fuerzas</summary>
        <label class="switch"><span>Física</span><input id="physics" type="checkbox"><i></i></label>
        <div id="forces"></div>
        <div class="buttons">
          <button id="reheat">Reanimar</button>
          <button id="fit">Encuadrar</button>
          <button id="reset">Restablecer</button>
        </div>
      </details>
    </div>
  </aside>

  <section id="card" class="card" hidden aria-live="polite"></section>
  <div id="tip" class="tip" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script src="../output/graph/bills.js" onerror="window.GRAPH_BILLS = null"></script>
  <script src="../output/graph/news.js" onerror="window.GRAPH_NEWS = null"></script>
  <script src="engine.js"></script>
  <script src="controls.js"></script>
  <script src="news.js"></script>
</body>
</html>
